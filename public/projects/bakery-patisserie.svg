<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgBakery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>
    <filter id="shadowBakery" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D1C0F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="520" fill="url(#bgBakery)"/>

  <!-- Grid lines -->
  <g stroke="#E5DCCE" stroke-width="1" opacity="0.6">
    <line x1="40" y1="0" x2="40" y2="520"/>
    <line x1="760" y1="0" x2="760" y2="520"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <!-- Browser Frame -->
  <g filter="url(#shadowBakery)">
    <rect x="44" y="36" width="712" height="448" rx="12" fill="#FFFFFF" stroke="#DCD3C4" stroke-width="1.5"/>

    <!-- Browser Header Bar -->
    <rect x="44" y="36" width="712" height="38" rx="12" fill="#F8F5EE"/>
    <line x1="44" y1="74" x2="756" y2="74" stroke="#E6DCCE" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="68" cy="55" r="4.5" fill="#E26D5C"/>
    <circle cx="82" cy="55" r="4.5" fill="#EBB44F"/>
    <circle cx="96" cy="55" r="4.5" fill="#66B386"/>

    <!-- URL Pill -->
    <rect x="180" y="45" width="440" height="20" rx="6" fill="#FFFFFF" stroke="#E0D7C9" stroke-width="1"/>
    <text x="400" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#756C60" text-anchor="middle" font-weight="500">aveniq-bakery.vercel.app/order-online</text>

    <!-- App Navbar -->
    <g transform="translate(44, 74)">
      <rect width="712" height="46" fill="#FFFFFF"/>
      <line x1="0" y1="46" x2="712" y2="46" stroke="#EFE7DA" stroke-width="1"/>
      
      <!-- Store Brand -->
      <text x="28" y="29" font-family="'Georgia', serif" font-size="15" font-weight="700" fill="#2E1B10" letter-spacing="1">AVENIQ PATISSERIE</text>
      
      <!-- Nav Links -->
      <text x="215" y="28" font-family="sans-serif" font-size="11" fill="#111111" font-weight="600">Sourdoughs</text>
      <text x="310" y="28" font-family="sans-serif" font-size="11" fill="#786F64">Cakes & Tarts</text>
      <text x="410" y="28" font-family="sans-serif" font-size="11" fill="#786F64">Bespoke Orders</text>
      <text x="520" y="28" font-family="sans-serif" font-size="11" fill="#786F64">Our Craft</text>
      
      <!-- Cart Icon & Pill -->
      <rect x="622" y="10" width="66" height="26" rx="4" fill="#3D2415"/>
      <text x="655" y="27" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Bag (2)</text>
    </g>

    <!-- Main Editorial Showcase -->
    <g transform="translate(44, 120)">
      <!-- Left Column: Artisan Editorial Banner -->
      <g transform="translate(24, 20)">
        <rect width="320" height="200" rx="8" fill="#F6F0E4" stroke="#E3D7C4"/>
        <text x="24" y="36" font-family="sans-serif" font-size="9" font-weight="700" fill="#8C5E3C" letter-spacing="1">SLOW FERMENTED DAILY</text>
        <text x="24" y="70" font-family="'Georgia', serif" font-size="22" font-weight="600" fill="#2E1B10">
          Artisanal Breads &amp;
        </text>
        <text x="24" y="96" font-family="'Georgia', serif" font-size="22" font-style="italic" font-weight="400" fill="#2E1B10">
          French Patisserie.
        </text>
        <text x="24" y="125" font-family="sans-serif" font-size="10.5" fill="#6B594B" line-height="1.4">
          Direct morning delivery with real-time bake tracking and custom pre-orders.
        </text>

        <rect x="24" y="148" width="134" height="32" rx="4" fill="#2E1B10"/>
        <text x="91" y="168" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Order Fresh Bake →</text>
      </g>

      <!-- Right Column: Product Cards Grid -->
      <g transform="translate(360, 20)">
        <rect width="324" height="200" rx="8" fill="#FAF7F2" stroke="#E8DFD0"/>
        
        <!-- Product Card 1 -->
        <g transform="translate(14, 14)">
          <rect width="140" height="172" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
          <rect x="10" y="10" width="120" height="80" rx="4" fill="#EFE5D4"/>
          <!-- Bread Shape -->
          <ellipse cx="70" cy="50" rx="36" ry="24" fill="#C49A6C"/>
          <path d="M 50 42 Q 70 54 90 42" stroke="#8A5A2B" stroke-width="2" fill="none"/>
          
          <text x="10" y="106" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#111111">Country Sourdough</text>
          <text x="10" y="120" font-family="sans-serif" font-size="9" fill="#756A5E">36hr Ferment • 800g</text>
          <text x="10" y="146" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2E1B10">$9.50</text>
          <rect x="88" y="132" width="42" height="24" rx="3" fill="#2E1B10"/>
          <text x="109" y="148" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add</text>
        </g>

        <!-- Product Card 2 -->
        <g transform="translate(168, 14)">
          <rect width="142" height="172" rx="6" fill="#FFFFFF" stroke="#EAE0D2"/>
          <rect x="10" y="10" width="122" height="80" rx="4" fill="#EFE5D4"/>
          <!-- Croissant Shape -->
          <circle cx="71" cy="50" r="22" fill="#DDB47D"/>
          <ellipse cx="71" cy="50" rx="30" ry="14" fill="#B98547"/>
          
          <text x="10" y="106" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#111111">Almond Croissant</text>
          <text x="10" y="120" font-family="sans-serif" font-size="9" fill="#756A5E">Normandy Butter • Frangipane</text>
          <text x="10" y="146" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2E1B10">$5.75</text>
          <rect x="90" y="132" width="42" height="24" rx="3" fill="#2E1B10"/>
          <text x="111" y="148" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add</text>
        </g>
      </g>

      <!-- Bottom Trust Ribbon -->
      <g transform="translate(24, 234)">
        <rect width="660" height="36" rx="4" fill="#F8F4EC" stroke="#E8E0D2"/>
        <text x="30" y="22" font-family="sans-serif" font-size="10" font-weight="500" fill="#422919">Daily Oven Dispatch</text>
        <text x="250" y="22" font-family="sans-serif" font-size="10" font-weight="500" fill="#422919">Contactless Local Courier</text>
        <text x="470" y="22" font-family="sans-serif" font-size="10" font-weight="500" fill="#422919">Live Kitchen Prep Tracker</text>
      </g>
    </g>
  </g>
</svg>

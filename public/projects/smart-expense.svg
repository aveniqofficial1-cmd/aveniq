<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgSmart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EAEEF3"/>
    </linearGradient>
    <filter id="shadowSmart" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="520" fill="url(#bgSmart)"/>

  <!-- Grid lines -->
  <g stroke="#DCE1E8" stroke-width="1" opacity="0.6">
    <line x1="40" y1="0" x2="40" y2="520"/>
    <line x1="760" y1="0" x2="760" y2="520"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <!-- Browser Frame -->
  <g filter="url(#shadowSmart)">
    <rect x="44" y="36" width="712" height="448" rx="12" fill="#FFFFFF" stroke="#D1D6DE" stroke-width="1.5"/>

    <!-- Browser Header Bar -->
    <rect x="44" y="36" width="712" height="38" rx="12" fill="#F8FAFC"/>
    <line x1="44" y1="74" x2="756" y2="74" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="68" cy="55" r="4.5" fill="#EF4444"/>
    <circle cx="82" cy="55" r="4.5" fill="#F59E0B"/>
    <circle cx="96" cy="55" r="4.5" fill="#10B981"/>

    <!-- URL Pill -->
    <rect x="180" y="45" width="440" height="20" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="400" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="600">smart-expense-tracker-pearl-delta.vercel.app</text>

    <!-- App Header -->
    <g transform="translate(44, 74)">
      <rect width="712" height="46" fill="#FFFFFF"/>
      <line x1="0" y1="46" x2="712" y2="46" stroke="#F1F5F9" stroke-width="1"/>
      
      <!-- App Brand -->
      <circle cx="36" cy="23" r="10" fill="#0F172A"/>
      <text x="36" y="27" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">₹</text>
      <text x="54" y="27" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">Smart Expense Tracker</text>
      
      <!-- Nav Tabs -->
      <text x="240" y="27" font-family="sans-serif" font-size="11" fill="#0F172A" font-weight="600">Dashboard</text>
      <line x1="240" y1="42" x2="300" y2="42" stroke="#0F172A" stroke-width="2"/>
      <text x="320" y="27" font-family="sans-serif" font-size="11" fill="#64748B">Budgets</text>
      <text x="390" y="27" font-family="sans-serif" font-size="11" fill="#64748B">Category Breakdown</text>
      <text x="520" y="27" font-family="sans-serif" font-size="11" fill="#64748B">Export</text>
      
      <!-- User Profile -->
      <rect x="618" y="10" width="76" height="26" rx="6" fill="#0F172A"/>
      <text x="656" y="27" font-family="sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add Entry</text>
    </g>

    <!-- Main Dashboard Body -->
    <g transform="translate(44, 120)">
      
      <!-- Top Metric Cards -->
      <!-- Card 1: Total Balance -->
      <g transform="translate(24, 14)">
        <rect width="206" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="28" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748B">TOTAL BALANCE</text>
        <text x="16" y="54" font-family="sans-serif" font-size="20" font-weight="800" fill="#0F172A">₹1,24,500</text>
        <text x="144" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">+18.4%</text>
      </g>

      <!-- Card 2: Monthly Burn -->
      <g transform="translate(250, 14)">
        <rect width="206" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="28" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748B">MONTHLY EXPENSES</text>
        <text x="16" y="54" font-family="sans-serif" font-size="20" font-weight="800" fill="#EF4444">₹32,480</text>
        <text x="144" y="52" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748B">64% of Cap</text>
      </g>

      <!-- Card 3: Invoiced -->
      <g transform="translate(476, 14)">
        <rect width="208" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="28" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748B">MONTHLY SAVINGS</text>
        <text x="16" y="54" font-family="sans-serif" font-size="20" font-weight="800" fill="#10B981">₹92,020</text>
        <text x="136" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">On Target</text>
      </g>

      <!-- Middle: Visual Graph + Ledger -->
      <!-- Spending Trends Graph -->
      <g transform="translate(24, 102)">
        <rect width="360" height="165" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#0F172A">Expense Velocity &amp; Monthly Trends</text>
        <text x="16" y="38" font-family="sans-serif" font-size="9" fill="#94A3B8">Real-time Category Aggregations (May – Oct 2026)</text>
        
        <!-- Bar Chart Visual -->
        <rect x="24" y="110" width="28" height="30" rx="3" fill="#E2E8F0"/>
        <text x="38" y="152" font-family="sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">MAY</text>

        <rect x="76" y="90" width="28" height="50" rx="3" fill="#E2E8F0"/>
        <text x="90" y="152" font-family="sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">JUN</text>

        <rect x="128" y="70" width="28" height="70" rx="3" fill="#E2E8F0"/>
        <text x="142" y="152" font-family="sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">JUL</text>

        <rect x="180" y="60" width="28" height="80" rx="3" fill="#CBD5E1"/>
        <text x="194" y="152" font-family="sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">AUG</text>

        <rect x="232" y="45" width="28" height="95" rx="3" fill="#94A3B8"/>
        <text x="246" y="152" font-family="sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">SEP</text>

        <rect x="284" y="32" width="28" height="108" rx="3" fill="#0F172A"/>
        <text x="298" y="152" font-family="sans-serif" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">OCT</text>
      </g>

      <!-- Right: Real-time Transaction Ledger -->
      <g transform="translate(400, 102)">
        <rect width="284" height="165" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#0F172A">Live Transaction Stream</text>
        <text x="220" y="24" font-family="sans-serif" font-size="9" font-weight="600" fill="#3B82F6">Filtered</text>
        
        <!-- Row 1 -->
        <g transform="translate(16, 38)">
          <circle cx="12" cy="12" r="10" fill="#F1F5F9"/>
          <text x="12" y="15" font-family="sans-serif" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">DEV</text>
          <text x="32" y="10" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">Vercel Pro Plan</text>
          <text x="32" y="21" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Software • Oct 08</text>
          <text x="248" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#EF4444" text-anchor="end">-₹1,650</text>
        </g>
        <line x1="16" y1="72" x2="268" y2="72" stroke="#F1F5F9" stroke-width="1"/>

        <!-- Row 2 -->
        <g transform="translate(16, 78)">
          <circle cx="12" cy="12" r="10" fill="#F1F5F9"/>
          <text x="12" y="15" font-family="sans-serif" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">DSN</text>
          <text x="32" y="10" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">Figma Workspace</text>
          <text x="32" y="21" font-family="sans-serif" font-size="8.5" fill="#94A3B8">Design • Oct 06</text>
          <text x="248" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#EF4444" text-anchor="end">-₹980</text>
        </g>
        <line x1="16" y1="112" x2="268" y2="112" stroke="#F1F5F9" stroke-width="1"/>

        <!-- Row 3 -->
        <g transform="translate(16, 118)">
          <circle cx="12" cy="12" r="10" fill="#DCFCE7"/>
          <text x="12" y="15" font-family="sans-serif" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">INC</text>
          <text x="32" y="10" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F172A">Client Retainer Payout</text>
          <text x="32" y="21" font-family="sans-serif" font-size="8.5" fill="#16A34A">Direct Deposit</text>
          <text x="248" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#16A34A" text-anchor="end">+₹65,000</text>
        </g>
      </g>
    </g>
  </g>
</svg>
